<!--
        Bài học về animation :
    Cách tạo animation :
Bước 1 : Tạo keyframe 
  - @keyframe move {
  
  }
Bước 2 : gán keyframe cho element cần animation 

** Các thuộc tính quan trọng 
I. Duration ( thời gian) 

 animation : move 1s; // 1s đó chính là duration

II. Iteration ( Lặp)
animation-iteration-count: infinite // chạy mãi mãi

III. Direction ( hướng)
animation-direction : alternate ; // chạy qua lại

IV. Timing-function
animation-timing-function : ease;

V. Delay 

animation-delay : 1s;

VI. Fill mode 

animation-fill-mode : forwards;
-->
