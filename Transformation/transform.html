<!--
            Transform : là tính năng thay đổi hình dạng,vị trí
của element mà kh phá layout. 
 1. Thay đổi vị trí 
   - Transform : translateX(10px); // Sang phải 10px
   - Transform : translateY(-10px); // Sang phải 10px
   - Transform : translate(-10px,10px); // Sang phải 10px
 2. Thay đổi kích cỡ 
   - Transform : scale(1.2) ; // to lên 120% 
 3. Xoay 
   - transform : rotate(45deg) ; // xoay 45 độ 

         
-->
